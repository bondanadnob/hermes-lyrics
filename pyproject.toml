[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lyrics"
version = "0.3.1"
description = "Lyrics for Music.app in Hermes Desktop"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1"]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.urls]
Repository = "https://github.com/bondanadnob/hermes-lyrics"

[tool.setuptools]
packages = ["dashboard", "dashboard.apple_music_lyrics_backend"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
